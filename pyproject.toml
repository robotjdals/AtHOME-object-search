[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "athome"
version = "0.1.0"
description = "Hierarchical scene graph and object-goal navigation"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Developer tools (scripts/): check images (matplotlib), and credentials read
# from a .env file by the tool itself, never sourced into the shell. Not
# needed on the robot, where the process environment provides the variables.
tools = ["python-dotenv>=1.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# ROS2 launch_testing plugin is incompatible with pytest 9.
addopts = "-p no:launch_testing -p no:launch_ros"
